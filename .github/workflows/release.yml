name: Build and publish release

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - public/**
      - src/**
      - sidepanel.html
      - vite.config.ts
      - tsconfig.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Read package version
        id: version
        shell: bash
        run: echo "version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Package Chrome extension
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd dist
          zip -r "../recall-ai-bookmark-finder-v${VERSION}.zip" .
          cd ..
          test -f "recall-ai-bookmark-finder-v${VERSION}.zip"
          unzip -l "recall-ai-bookmark-finder-v${VERSION}.zip" | grep -q 'manifest.json'

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Recall v${{ steps.version.outputs.version }}
          body: |
            ## Recall v${{ steps.version.outputs.version }}

            Retrieval-first rebuild of the Chrome bookmark extension.

            ### Highlights
            - Fast local bookmark search with fuzzy ranking.
            - Searchable notes, favorites, recent searches, categories, and duplicate detection.
            - Chrome omnibox search with `bm`.
            - Save-current-page flow.
            - AI/local descriptions and tags that improve later retrieval.
            - Review-first cleanup with edit, selective apply, and undo.
            - Modern dark Recall UI and new bookmark icon.
            - Simplified AI/privacy settings with optional custom-host permissions.

            ### Install in Chrome
            1. Download `recall-ai-bookmark-finder-v${{ steps.version.outputs.version }}.zip` below.
            2. Unzip it.
            3. Open `chrome://extensions`.
            4. Enable **Developer mode**.
            5. Click **Load unpacked**.
            6. Select the unzipped folder containing `manifest.json`.

            The downloadable ZIP is the built Chrome extension package. Do not use GitHub's automatically generated source-code ZIP for installation.
          files: recall-ai-bookmark-finder-v${{ steps.version.outputs.version }}.zip
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
